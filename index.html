<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070F">
<title>Ordinário News</title>
<meta name="description" content="Indicações locais, eventos, notícias e novidades de Maracanaú, Ceará.">
<meta property="og:type" content="website">
<meta property="og:title" content="Ordinário News">
<meta property="og:description" content="Indicações locais, eventos, notícias e novidades de Maracanaú, Ceará.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Sora:wght@600;700&display=swap">
<style id="on-css">
/* Layout: uma tela por área, como um app. O Início resume tudo; barra inferior no celular, menu no topo no computador.
   Cor: azul-preto como base, um único azul elétrico como destaque; amarelo só para ingresso e contagem; verde só para WhatsApp. */
:root{
  color-scheme:dark;
  --bg:#05070F;
  --surface:#0B1020;
  --surface-2:#11182C;
  --surface-3:#1A2440;
  --line:rgba(160,185,255,.11);
  --line-2:rgba(160,185,255,.22);
  --text:#F3F6FD;
  --text-2:#AEB9D2;
  --text-3:#8390AE;
  --blue:#2F6BFF;
  --royal:#1B3FCF;
  --cyan:#5CDBFF;
  --yellow:#FFD60A;
  --green:#25D366;
  --danger:#FF7286;
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-lg:20px;
  --r:16px;
  --r-sm:12px;
  --gutter:16px;
  --bar:64px;
}
@media (min-width:880px){:root{--gutter:32px;--bar:0px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.ed-open{overflow:hidden}
body{
  position:relative;margin:0;background:var(--bg);color:var(--text);
  font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;
  padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px));
}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{width:100%;max-width:1160px;margin-inline:auto;padding-inline:var(--gutter)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:20px;height:20px;flex:none;display:block}

.glow{position:absolute;top:0;left:0;right:0;height:620px;z-index:-1;pointer-events:none;overflow:hidden}
.glow::before{
  content:"";position:absolute;left:50%;top:-300px;width:min(1200px,190vw);height:680px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(47,107,255,.55),rgba(47,107,255,.16) 58%,transparent);
}
.glow::after{
  content:"";position:absolute;left:66%;top:-230px;width:min(620px,100vw);height:460px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(92,219,255,.26),transparent);
}

/* ---------- topo ---------- */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:rgba(5,7,15,.72);-webkit-backdrop-filter:saturate(160%) blur(16px);backdrop-filter:saturate(160%) blur(16px);
  border-bottom:1px solid var(--line);
}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:center;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.02em;text-decoration:none;flex:none}
.brand img{height:38px;width:auto;max-width:150px;object-fit:contain}
.brand em{font-style:normal;color:var(--cyan);margin-left:.28em}
.menu{display:none}
.menu a{padding:8px 13px;border-radius:10px;color:var(--text-2);font-size:14.5px;font-weight:500;text-decoration:none;transition:color .15s,background .15s}
.menu a:hover{color:var(--text);background:var(--surface-2)}
.menu a.on{color:var(--text);background:var(--surface-3)}
.top-cta{min-height:38px;padding:0 13px;font-size:14px;border-radius:10px}
.top-cta.on{border-color:var(--blue)}
@media (min-width:880px){.menu{display:flex;gap:2px}}

/* ---------- barra inferior (celular) ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(8,11,22,.9);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);
  border-top:1px solid var(--line);
}
.tabbar a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:64px;min-width:0;
  color:var(--text-3);font-size:11px;font-weight:500;text-decoration:none;transition:color .15s;
}
.tabbar .tb-ic{display:grid;place-items:center;width:46px;height:28px;border-radius:999px;transition:background .15s}
.tabbar .i{width:21px;height:21px}
.tabbar a.on{color:var(--text)}
.tabbar a.on .tb-ic{background:rgba(47,107,255,.26);color:var(--cyan)}
@media (min-width:880px){.tabbar{display:none}}

/* ---------- botões ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);
  font-family:var(--body);font-weight:600;font-size:14.5px;line-height:1.2;text-decoration:none;text-align:center;cursor:pointer;
  transition:background .15s,border-color .15s,transform .1s,filter .15s;
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn .i{width:18px;height:18px}
.btn-blue{background:linear-gradient(180deg,#3B77FF,#2559EA);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);color:#fff}
.btn-blue:hover{background:linear-gradient(180deg,#3B77FF,#2559EA);filter:brightness(1.1)}
.btn-yellow{background:var(--yellow);border-color:transparent;color:#17140A}
.btn-yellow:hover{background:var(--yellow);filter:brightness(1.06)}
.btn-green{background:var(--green);border-color:transparent;color:#04210F}
.btn-green:hover{background:var(--green);filter:brightness(1.07)}
.btn-ghost{background:transparent}
.btn-sm{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn-full{width:100%}

/* ---------- início ---------- */
.home{display:grid;gap:28px;padding-block:32px 8px}
@media (min-width:1000px){.home{grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:64px;align-items:start;padding-block:64px 8px}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;row-gap:20px;align-items:center}
.hero-logo{grid-column:1;max-height:92px;max-width:100%;width:auto;object-fit:contain}
.hero-mascot{grid-column:2;grid-row:1;max-height:128px;max-width:128px;width:auto;object-fit:contain}
.hero-body{grid-column:1/-1;display:grid;gap:14px}
@media (min-width:1000px){.hero-logo{max-height:112px}.hero-mascot{max-height:190px;max-width:190px}}
.where{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--text-2);font-size:14px;font-weight:500}
.where .i{width:16px;height:16px;color:var(--cyan)}
.hero h1{
  font-family:var(--display);font-weight:600;font-size:clamp(34px,9.4vw,58px);line-height:1.06;letter-spacing:-.04em;text-wrap:balance;
}
.grad{background:linear-gradient(95deg,#7FE4FF,#4C8DFF 62%,#3F74FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--text-2);font-size:16.5px;line-height:1.55;max-width:58ch}
.actions{display:grid;gap:10px;margin-top:8px;max-width:560px}
.wa-main{min-height:54px;font-size:15.5px;border-radius:14px}
.wa-main .i{width:22px;height:22px}
.socials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.soc{
  display:flex;flex-direction:column;align-items:flex-start;gap:9px;min-width:0;padding:12px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .15s,background .15s,transform .1s;
}
a.soc:hover{border-color:var(--line-2);background:var(--surface-2)}
a.soc:active{transform:scale(.98)}
.soc b{display:block;font-weight:600;font-size:14px;line-height:1.25}
.soc small{display:block;font-size:12px;line-height:1.3;color:var(--text-2);overflow-wrap:anywhere}
.soc.off small{color:var(--yellow)}
.soc.off .b-ic{opacity:.55}
@media (min-width:520px){.soc{flex-direction:row;align-items:center}}
.b-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.b-ic svg{width:21px;height:21px;display:block}
.b-ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.b-tt{background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.b-tt .c{fill:#25f4ee}.b-tt .r{fill:#fe2c55}.b-tt .w{fill:#fff}
.b-wa{background:var(--green)}
.b-kw{background:#FF7A00}

/* busca */
.search{position:relative}
.search .i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search input{
  width:100%;height:54px;padding:0 16px 0 46px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--text);font-family:var(--body);font-size:16px;-webkit-appearance:none;appearance:none;transition:border-color .15s,background .15s;
}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:none;border-color:var(--blue);background:var(--surface-2)}
.search input::-webkit-search-cancel-button{filter:invert(1) opacity(.5)}
.results{display:grid;gap:6px;margin-top:8px}
.results:empty{display:none}
.res{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 12px;padding:11px 14px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);text-decoration:none;transition:background .15s;
}
.res:hover{background:var(--surface-3)}
.res b{grid-column:1;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.res small{grid-column:1;font-size:12.5px;color:var(--text-2)}
.res .i{grid-column:2;grid-row:1/span 2;width:18px;height:18px;color:var(--text-3)}
.res-none{padding:12px 2px;color:var(--text-2);font-size:14.5px}
.res-none a{color:var(--cyan)}

/* grade de áreas */
.explore{display:grid;gap:12px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{
  position:relative;display:flex;flex-direction:column;gap:14px;min-width:0;padding:16px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);text-decoration:none;
  transition:border-color .15s,transform .15s;
}
a.tile:hover{border-color:var(--line-2);transform:translateY(-1px)}
a.tile:active{transform:scale(.99)}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(47,107,255,.17);color:var(--cyan)}
.tile-arrow{color:var(--text-3);width:18px;height:18px}
.tile h2{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.2;letter-spacing:-.02em}
.tile p{margin-top:4px;color:var(--text-2);font-size:13.5px;line-height:1.35}
.tile-main{
  grid-column:1/-1;background:linear-gradient(135deg,var(--royal) 0%,var(--blue) 62%,#3F8CFF 100%);border-color:rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 50px -24px rgba(47,107,255,.9);
}
.tile-main:hover{border-color:rgba(255,255,255,.3)}
.tile-link{text-decoration:none}
.tile-link::after{content:"";position:absolute;inset:0;border-radius:inherit}
.tile-main .ic{background:rgba(255,255,255,.16);color:#fff}
.tile-main h2{font-size:21px}
.tile-main p{color:rgba(255,255,255,.86);font-size:14.5px}
.tile-main .tile-arrow{color:#fff}
.gchips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px}
.gchip{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px 0 9px;border-radius:999px;cursor:pointer;
  background:rgba(4,10,34,.32);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:500;text-decoration:none;transition:background .15s;
}
.gchip:hover{background:rgba(4,10,34,.55)}
.gchip .i{width:15px;height:15px}

/* blocos do início */
.block{padding-top:36px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh h2{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.025em;line-height:1.2}
.sh a{flex:none;color:var(--cyan);font-size:14px;font-weight:500;text-decoration:none}
.sh a:hover{text-decoration:underline}
.hscroll{
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;
  margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter);padding-block:2px;
}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .vid{flex:0 0 148px;scroll-snap-align:start;scroll-margin-left:var(--gutter)}
@media (min-width:880px){.hscroll .vid{flex-basis:186px}}
@media (min-width:1160px){.hscroll .vid{flex-basis:calc((100% - 50px) / 6)}}

/* ---------- áreas ---------- */
.view{padding-block:32px 8px}
@media (min-width:880px){.view{padding-block:56px 8px}}
.enter{animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}.btn,.tile,.soc,.tabbar a{transition:none}}
.head{display:grid;gap:8px;margin-bottom:24px;max-width:720px}
.kicker{color:var(--cyan);font-size:14px;font-weight:500}
.head h1{font-family:var(--display);font-weight:600;font-size:clamp(29px,7.6vw,46px);line-height:1.1;letter-spacing:-.035em;text-wrap:balance}
.head p{color:var(--text-2);font-size:16px;max-width:60ch}
.none{
  display:grid;gap:12px;justify-items:start;padding:22px;max-width:620px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);
}
.none h2{font-family:var(--display);font-weight:600;font-size:18.5px;line-height:1.25;letter-spacing:-.02em}
.none p{color:var(--text-2);font-size:15px;margin-top:-6px}
.none-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.scroller{
  flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  margin-inline:calc(var(--gutter) * -1);padding:2px var(--gutter) 12px;
}
.scroller::-webkit-scrollbar{display:none}
.scroller .pill{white-space:nowrap}
.pill{
  flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:5px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;line-height:1.25;text-align:left;text-decoration:none;
  transition:background .15s,border-color .15s;
}
.pill:hover{background:var(--surface-3)}
.pill.empty,.group .pill.empty{background:transparent;border-color:var(--line);color:var(--text-3)}
.pill.on,.pill[aria-selected="true"]{background:var(--blue);border-color:transparent;color:#fff}
.pill .n{color:var(--yellow);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill.on .n,.pill[aria-selected="true"] .n{color:#fff}

/* indicações */
.dir-search{margin-bottom:18px;max-width:620px}
.dir{columns:1;column-gap:12px}
@media (min-width:720px){.dir{columns:2}}
@media (min-width:1080px){.dir{columns:3}}
.group{display:grid;gap:14px;margin-bottom:12px;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);scroll-margin-top:76px;min-width:0;break-inside:avoid}
.group-h{display:flex;align-items:center;gap:10px}
.group-h .ic{width:34px;height:34px;border-radius:10px}
.group-h .i{width:18px;height:18px}
.group-h h2{font-family:var(--display);font-weight:600;font-size:15.5px;letter-spacing:-.015em;line-height:1.25}
.group .pill{background:var(--surface-2);flex:0 1 auto;min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:0;background:none;border:0;color:var(--text-2);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none}
.back:hover{color:var(--text)}
.back .i{width:17px;height:17px}
.seg-h{margin:8px 0 18px}
.seg-h h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,6.6vw,38px);line-height:1.12;letter-spacing:-.03em;text-wrap:balance}
.seg-h p{margin-top:4px;color:var(--text-2);font-size:14.5px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{display:flex;flex-direction:column;min-width:0;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.card-img{position:relative;overflow:hidden;aspect-ratio:16/9;background:var(--surface-3);max-width:100%}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.card-body{display:grid;gap:10px;align-content:start;padding:16px;flex:1;min-width:0}
.card h2{font-family:var(--display);font-weight:600;font-size:17.5px;line-height:1.25;letter-spacing:-.02em;overflow-wrap:anywhere}
.card p{color:var(--text-2);font-size:14.5px;line-height:1.45}
.meta{display:grid;gap:6px;color:var(--text-2);font-size:14px;line-height:1.35}
.meta div{display:flex;align-items:flex-start;gap:8px;min-width:0;overflow-wrap:anywhere}
.meta .i{width:16px;height:16px;margin-top:1px;color:var(--text-3)}
.card-acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px}
.card-acts .btn{flex:1 1 auto}

/* vídeos */
.filters{margin-bottom:6px}
.vids{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.vids{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:880px){.vids{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
@media (min-width:1080px){.vids{grid-template-columns:repeat(5,minmax(0,1fr))}}
.vid{
  display:flex;flex-direction:column;max-width:100%;min-width:0;border-radius:var(--r);overflow:hidden;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s;
}
a.vid:hover{border-color:var(--line-2);transform:translateY(-2px)}
.vid-cover{position:relative;display:block;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:linear-gradient(160deg,var(--surface-3),var(--surface))}
.vid-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
.vid-cover.tall{aspect-ratio:9/16}
.vid-cover.tall img{object-position:center}
.vid-stats{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:2px;font-style:normal;color:var(--yellow);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.vid-stats i{display:inline-flex;align-items:center;gap:4px;font-style:normal}
.vid-stats .i{width:14px;height:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:640px){.stats{gap:12px}}
.stat{display:grid;gap:5px;align-content:start;min-width:0;padding:13px 11px;border-radius:var(--r);background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line)}
@media (min-width:640px){.stat{padding:18px}}
.stat b{font-family:var(--display);font-weight:600;font-size:clamp(18px,5vw,34px);line-height:1.1;letter-spacing:-.03em;white-space:nowrap}
.stat span{color:var(--text-2);font-size:12.5px;line-height:1.3}
@media (min-width:640px){.stat span{font-size:14px}}
.stats-note{margin-top:10px;color:var(--text-3);font-size:12.5px;line-height:1.45;max-width:70ch}

    var all = S.events.slice().sort(function (a, b) { return (a.date || '9999').localeCompare(b.date || '9999'); });

    if (UI.evType && types.indexOf(UI.evType) === -1) UI.evType = '';
    var list = all.filter(function (e) { return !UI.evType || e.type === UI.evType; });
    var up = list.filter(function (e) { return !e.date || e.date >= today; });
    var past = list.filter(function (e) { return e.date && e.date < today; }).reverse();
    var body;
    if (!all.length) {
      body = none('ticket', 'A programação entra aqui em breve', 'Cada evento vai ter data, local e o link oficial para garantir seu ingresso.', waBtn('Divulgar um evento', 'btn-sm'));

  /* navegação: cada área tem um endereço próprio (#videos, #seg-pizzarias…) */
  function route() {
    var h = '';
    try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* endereço inválido: volta ao início */ }
    if (h.indexOf('seg-') === 0 && segName(h.slice(4))) return { view: 'indicacoes', seg: h.slice(4) };
    return { view: VIEWS[h] ? h : 'inicio', seg: null };
  }
  function go(view, seg, groupId) {
    UI.view = view; UI.seg = seg || null; UI.q = '';
    var h = seg ? 'seg-' + seg : view;
    if (location.hash.slice(1) !== h) { try { location.hash = h; } catch (e) { /* a tela muda mesmo sem endereço */ } }
    render(true);
    var target = groupId && document.getElementById('grp-' + groupId);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
    if (ART) renderEditor();
  }
  window.addEventListener('hashchange', function () {
    var r = route();
    if (r.view === UI.view && r.seg === UI.seg) return;
    UI.view = r.view; UI.seg = r.seg; UI.q = '';
    render(true);
    window.scrollTo(0, 0);
    if (ART) renderEditor();
  });

  app.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-go],[data-evtype],[data-vidseg],[data-act]');
    if (!t || !app.contains(t)) return;
    if (t.hasAttribute('data-go')) {
      ev.preventDefault();
      go(t.getAttribute('data-go'), t.getAttribute('data-seg'), t.getAttribute('data-group'));
    } else if (t.hasAttribute('data-evtype')) { UI.evType = t.getAttribute('data-evtype'); render(false); }
    else if (t.hasAttribute('data-vidseg')) { UI.vidSeg = t.getAttribute('data-vidseg'); render(false); }
    else if (t.getAttribute('data-act') === 'more-news') { UI.newsShown += 8; render(false); }
  });
  app.addEventListener('input', function (ev) {
    var t = ev.target, scope = t.getAttribute && t.getAttribute('data-search');
    if (!scope) return;
    UI.q = t.value;
    document.getElementById('results').innerHTML = resultsHtml(UI.q, scope);
    var dir = document.getElementById('dir');
    if (dir) dir.hidden = !!norm(UI.q).trim();
  });

  UI.view = first.view; UI.seg = first.seg;

  render(false);

  function readImage(file, max, alpha) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error('Escolha um arquivo de imagem (JPG, PNG ou WebP).')); return; }
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('Não foi possível ler esta imagem.')); };
      fr.onload = function () {
        var im = new Image();
        im.onerror = function () { reject(new Error('Não foi possível abrir esta imagem. Tente salvar como JPG ou PNG.')); };
        im.onload = function () {
          var sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
          var w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var x = c.getContext('2d');
          if (!alpha) { x.fillStyle = '#0B1020'; x.fillRect(0, 0, w, h); }
          x.drawImage(im, 0, 0, w, h);
          var out = c.toDataURL('image/webp', alpha ? 0.9 : 0.8);
          if (out.indexOf('data:image/webp') !== 0) out = alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.82);
          resolve(out);
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

      eachImage(out, function (v) { return map[v] || v; });
      return ghCommit(cfg, files, JSON.stringify(out, null, 2) + '\n').then(function () {
        files.forEach(function (f) { LOCAL_IMG[f.path] = f.uri; });
        S = out;
      });
    });
  }
  function connectView() {
    return '<div class="ed solo" role="dialog" aria-modal="true" aria-label="Conectar o editor">' +
      '<div class="ed-top"><strong>Conectar o editor</strong><button type="button" class="btn btn-sm btn-ghost" data-ed="close">Ver o site</button></div>' +
      '<div class="ed-main"><p class="hint">Faça isso uma vez em cada aparelho que for usar para atualizar o site. O código fica guardado só neste navegador.</p>' +
      '<form class="ed-form" id="gh-form" novalidate>' +
      '<div class="fld"><label for="gh-repo">Repositório do site *</label><span class="h">No formato usuario/nome-do-repositorio.</span><input type="text" id="gh-repo" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
      '<div class="fld"><label for="gh-token">Código de acesso do GitHub *</label><span class="h">Crie um código só para este repositório, com permissão de gravar conteúdo.</span><input type="password" id="gh-token" autocomplete="off"></div>' +
      '<div id="ed-form-msg"></div><div class="form-acts"><button type="submit" class="btn btn-blue" id="gh-go">Conectar</button></div></form></div></div>';
  }
  function submitConnect() {
    var repo = document.getElementById('gh-repo').value.trim().replace(/^https:\/\/github\.com\//i, '').replace(/\/$/, '');
    var token = document.getElementById('gh-token').value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { formError('Escreva o repositório no formato usuario/nome-do-repositorio.'); return; }
    if (!token) { formError('Cole o código de acesso do GitHub.'); return; }
    var btn = document.getElementById('gh-go');
    btn.disabled = true; btn.textContent = 'Conectando…';
    ghApi({ repo: repo, token: token }, '').then(function (info) {
      if (info.permissions && !info.permissions.push) { var e = new Error('github'); e.code = 403; throw e; }
      try {
        localStorage.setItem(GH_KEY, JSON.stringify({ repo: repo, token: token, branch: info.default_branch || 'main' }));
      } catch (err) { formError('Este navegador não permite guardar a conexão. Tente sair do modo anônimo.'); btn.disabled = false; btn.textContent = 'Conectar'; return; }
      ED.msg = { kind: 'ok', text: 'Conectado. Agora é só editar e publicar.' };
      renderEditor();
    }, function (err) {
      btn.disabled = false; btn.textContent = 'Conectar';
      formError(publishErrorText(err && err.code));
    });
  }

  function publishErrorText(code) {
    switch (code) {
      case 401: return 'O código de acesso não é válido ou venceu. Use "Sair deste aparelho" e conecte de novo com um código novo.';
      case 403: return 'O código de acesso não tem permissão para gravar neste repositório.';
      case 404: return 'Repositório não encontrado. Confira o nome e se o código de acesso inclui este repositório.';
      case 409: case 422: return 'Outra atualização foi publicada ao mesmo tempo. Recarregue a página e publique de novo; suas alterações ficam guardadas neste navegador.';
      case 'conflict': return 'Outra versão do site foi publicada antes. A página vai recarregar e suas alterações ficam guardadas neste navegador.';
      case 'not_writer': case 'not_granted': case 'not_declared': case 'consent_required': case 'capability_disabled': case 'capability_removed':
        return 'Este acesso não pode publicar. Abra o site logado na conta dona do Ordinário News.';
      case 'too_large': return 'O site ficou grande demais para publicar. Remova algumas imagens ou use imagens menores.';
      case 'invalid_content': case 'transform_error': return 'Não foi possível montar a página para publicar. Recarregue e tente de novo.';
      case 'rate_limited': return 'Muitas publicações seguidas. Espere um minuto e publique de novo.';
      default: return 'Não foi possível publicar agora. Tente de novo em alguns instantes.';
    }
  }

  function doPublish() {
    if (!ART || ED.busy || !isDirty()) return;
    ED.busy = true; ED.msg = { kind: 'info', text: STATIC_SITE ? 'Publicando…' : 'Publicando… a página recarrega sozinha quando terminar.' };
    saveDraft(); renderEditor();
    ART.publish().then(function () {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* nada a limpar */ }
      PUBLISHED_JSON = dataJSON(S);
      ED.busy = false;
      ED.msg = { kind: 'ok', text: STATIC_SITE ? 'Publicado! O site atualiza para todo mundo em cerca de 1 minuto.' : 'Publicado! O site já está atualizado para todo mundo.' };
      render(false); renderEditor();
    }, function (err) {
      ED.busy = false;
      ED.msg = { kind: 'err', text: publishErrorText(err && err.code) };
      renderEditor();
    });
  }

  function doDownload() {
    if (!DL) return;
    DL.save({ filename: 'ordinario-news.html', data: buildDocument(S, true) }).then(function () {
      ED.msg = { kind: 'ok', text: 'Cópia salva. Esse arquivo funciona sozinho em qualquer hospedagem de site.' }; renderEditor();
    }, function (e) {
      if (e && (e.code === 'declined' || e.code === 'cancelled')) return;
      ED.msg = { kind: 'err', text: 'Não foi possível salvar a cópia agora.' }; renderEditor();
    });
  }

  document.addEventListener('click', function (ev) {
    var root = edRoot();
    if (!root || !root.contains(ev.target)) return;
    var colBtn = ev.target.closest('[data-col]');
    if (colBtn) {
      ED.col = colBtn.getAttribute('data-col'); ED.form = null; ED.confirm = null; ED.msg = null;
      renderEditor();
      var m = document.getElementById('ed-main'); if (m) m.scrollTop = 0;
      return;
    }
    var b = ev.target.closest('[data-ed]');
    if (!b) return;
    var a = b.getAttribute('data-ed'), c = COLS[ED.col];
    if (a === 'open') {
      ED.open = true; ED.form = null; ED.confirm = null;
      ED.col = VIEW_COL[UI.view] || 'profile';
      if (UI.seg) ED.placeSeg = UI.seg;
      ED.msg = ED.msg && (ED.msg.kind === 'err' || ED.msg.kind === 'info') ? ED.msg : null;
      renderEditor();
    }
    else if (a === 'close') { ED.open = false; ED.form = null; ED.confirm = null; if (!ED.busy) ED.msg = null; render(false); renderEditor(); }
    else if (a === 'publish') doPublish();
    else if (a === 'download') doDownload();
    else if (a === 'gh-logout') {
      try { localStorage.removeItem(GH_KEY); } catch (e) { /* nada a limpar */ }
      ED.open = false; ED.form = null; ED.msg = null; render(false); renderEditor();
    }
    else if (a === 'discard') {
      if (ED.confirm !== '__discard') { ED.confirm = '__discard'; renderEditor(); return; }
      S = JSON.parse(PUBLISHED_JSON); ED.confirm = null; ED.form = null;
      ED.msg = { kind: 'ok', text: 'Alterações descartadas. O editor voltou para a versão publicada.' };
      changed();
    }
    else if (a === 'new') {
      var d = {};
      if (ED.col === 'places' && ED.placeSeg) d.segment = ED.placeSeg;
      if (ED.col === 'events') d.ticketLabel = TICKET_LABELS[0];
      ED.form = { col: ED.col, id: null, d: d }; ED.msg = null; renderEditor();
    }
    else if (a === 'edit') {
      var id = b.getAttribute('data-id'), it = c.list().filter(function (x) { return x.id === id; })[0];
      if (it) { ED.form = { col: ED.col, id: id, d: clone(it) }; ED.msg = null; renderEditor(); }
    }
    else if (a === 'cancel') { ED.form = null; renderEditor(); }
    else if (a === 'del') { ED.confirm = b.getAttribute('data-id'); renderEditor(); }
    else if (a === 'del-no') { ED.confirm = null; renderEditor(); }
    else if (a === 'del-yes') deleteItem(b.getAttribute('data-id'));
    else if (a === 'up' || a === 'down') {
      var i = +b.getAttribute('data-i'), list = c.list(), j = a === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      var tmp = list[i]; list[i] = list[j]; list[j] = tmp; changed();
    }
    else if (a === 'img-clear') { collectForm(c); ED.form.d[b.getAttribute('data-k')] = ''; renderEditor(); }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (!edRoot() || !edRoot().contains(t)) return;
    if (t.hasAttribute('data-ed-filter')) { ED.placeSeg = t.value; renderEditor(); return; }
    var k = t.getAttribute('data-img');
    if (!k || !t.files || !t.files[0]) return;
    var c = COLS[ED.col], f = c.fields.filter(function (x) { return x.k === k; })[0];
    collectForm(c);
    readImage(t.files[0], f.max || 1000, !!f.alpha).then(function (data) {
      ED.form.d[k] = data; renderEditor();
    }, function (e) { renderEditor(); formError(e.message); });
  });

  document.addEventListener('submit', function (ev) {
    if (ev.target && ev.target.id === 'ed-form') { ev.preventDefault(); submitForm(); }
    if (ev.target && ev.target.id === 'gh-form') { ev.preventDefault(); submitConnect(); }
  });

  function restoreDraft() {
    var draft = readDraft();
    if (draft) normalize(draft);
    if (draft && dataJSON(draft) !== PUBLISHED_JSON) {
      S = draft;
      ED.msg = { kind: 'info', text: 'Recuperamos alterações que você fez e ainda não publicou. Revise e publique, ou descarte.' };
      render(false);
    } else { try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* nada a limpar */ } }
  }

  /* endereço próprio: o editor abre em #editar; visitantes nunca veem o botão */
  function bootStaticEditor() {
    function activate() {
      if (ART) return;
      ART = { publish: ghPublish };
      restoreDraft();
      renderEditor();
    }
    function check() {
      if (location.hash !== '#editar') return;
      activate();
      ED.open = true;
      renderEditor();
    }
    if (ghConfig()) activate();
    window.addEventListener('hashchange', check);
    check();
  }

  function bootEditor() {
    var cl = window.claude;
    if (!cl || typeof cl.use !== 'function') return;
    Promise.all([cl.use('artifact'), cl.use('user')]).then(function (r) {
      var art = r[0], user = r[1];
      if (!art || !user) return null;
      return user.canEdit().then(function (ok) {
        if (!ok) return;
        ART = { publish: function () { return art.publish(buildDocument(S)); } };
        cl.use('downloads').then(function (d) { DL = d; renderEditor(); }, function () { /* sem cópia para baixar */ });
        restoreDraft();
        renderEditor();
      });
    }).catch(function () { /* visitante comum: o site funciona sem o editor */ });
  }

  if (STATIC_SITE) bootStaticEditor();
  else if (window.claude) bootEditor();
  else window.addEventListener('load', bootEditor);
});
</script>
</body>
</html>
